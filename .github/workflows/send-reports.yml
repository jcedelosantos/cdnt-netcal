name: Send Scheduled Reports

on:
  schedule:
    - cron: '0 9 * * *'    # daily   — cada día a las 9:00 AM UTC
    - cron: '0 9 * * 1'    # weekly  — lunes a las 9:00 AM UTC
    - cron: '0 9 1 * *'    # monthly — día 1 de cada mes a las 9:00 AM UTC
  workflow_dispatch:
    inputs:
      frequency:
        description: Frecuencia de reporte a enviar
        required: true
        default: weekly
        type: choice
        options:
          - daily
          - weekly
          - monthly

jobs:
  send-reports:
    name: Send ${{ github.event.inputs.frequency || github.event.schedule }} reports
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Determine frequency
        id: freq
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FREQ="${{ github.event.inputs.frequency }}"
          elif [ "${{ github.event.schedule }}" = "0 9 * * *" ]; then
            FREQ="daily"
          elif [ "${{ github.event.schedule }}" = "0 9 * * 1" ]; then
            FREQ="weekly"
          else
            FREQ="monthly"
          fi
          echo "frequency=$FREQ" >> "$GITHUB_OUTPUT"
          echo "Frequency: $FREQ"

      - name: Send ${{ steps.freq.outputs.frequency }} reports
        run: |
          STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/reports?frequency=${{ steps.freq.outputs.frequency }}")

          echo "HTTP status: $STATUS"
          cat response.json

          if [ "$STATUS" != "200" ]; then
            echo "::error::Report send failed with HTTP $STATUS"
            exit 1
          fi

      - name: Print summary
        if: success()
        run: |
          echo "::notice::${{ steps.freq.outputs.frequency }} reports sent successfully"
          cat response.json
